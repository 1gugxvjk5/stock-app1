<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>股票趋势筛选工作台</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a2e">
  <style>
    body { font-family: sans-serif; background: #0f0f1a; color: #eee; margin: 0; padding-bottom: 60px; }
    .header { background: #1a1a2e; padding: 15px; position: sticky; top: 0; }
    .card { background: #1a1a2e; border-radius: 12px; padding: 14px; margin: 12px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; }
    .green { background: #00c85322; color: #00c853; }
    .red { background: #ff525222; color: #ff5252; }
    .yellow { background: #ffd74022; color: #ffd740; }
    .gray { background: #9e9e9e22; color: #9e9e9e; }
    .row { display: flex; justify-content: space-between; align-items: center; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
    .item { background: #0f0f1a; padding: 8px; border-radius: 8px; font-size: 13px; }
    .muted { color: #9e9e9e; font-size: 12px; }
    .tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a2e; display: flex; border-top: 1px solid #333; }
    .tab { flex: 1; text-align: center; padding: 10px; color: #9e9e9e; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h3 style="margin:0;">📈 股票趋势筛选工作台</h3>
    <span class="muted" id="updateTime">--:--</span>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <div class="muted">大盘环境</div>
        <div style="font-size:24px;font-weight:bold;" id="envValue">强</div>
        <div class="muted" id="envDesc">建议仓位 70%~100%</div>
      </div>
      <div style="font-size:40px;" id="envIcon">🟢</div>
    </div>
  </div>

  <div class="card">
    <h4 style="margin:0 0 10px;">📰 实时财经新闻</h4>
    <div id="newsList"></div>
  </div>

  <div class="card">
    <h4 style="margin:0 0 10px;">🔥 强板块</h4>
    <div id="sectorList" style="display:flex;gap:10px;overflow-x:auto;"></div>
  </div>

  <div class="card">
    <h4 style="margin:0 0 10px;">📋 今日信号</h4>
    <div id="stockList"></div>
  </div>

  <div class="tabbar">
    <div class="tab">🏠 首页</div>
    <div class="tab">🔍 选股</div>
    <div class="tab">⭐ 自选</div>
    <div class="tab">👤 我的</div>
  </div>

  <script>
    const data = {
      marketEnv: "强",
      news: [
        {t:"央行开展2000亿元MLF操作，利率持平", s:"利好", c:"positive", r:"大盘"},
        {t:"某半导体公司获大额订单，股价拉升", s:"利好", c:"positive", r:"半导体"},
        {t:"监管层对某高位股发出问询函", s:"利空", c:"negative", r:"监管"},
        {t:"新能源汽车销量超预期，产业链受益", s:"利好", c:"positive", r:"新能源车"}
      ],
      sectors: [
        {n:"半导体", score:5, state:"持续强势"},
        {n:"人工智能", score:4, state:"持续强势"},
        {n:"新能源车", score:4, state:"正在加强"},
        {n:"军工", score:3, state:"正在加强"}
      ],
      stocks: [
        {n:"某半导体设备股", c:"688xxx", d:"买", h:"长期（1-3个月）", p:68, r5:"+6.2%", r10:"+11.5%", r20:"+18.3%", d20:"+8.1%", atr:"2.4%", vr:"1.35", st:"趋势观察", ns:"正面"},
        {n:"某AI算力股", c:"300xxx", d:"观察", h:"短期（1-2周）", p:55, r5:"+4.8%", r10:"+9.2%", r20:"+15.6%", d20:"+5.2%", atr:"3.1%", vr:"1.22", st:"启动观察", ns:"中性"},
        {n:"某新能源车零部件", c:"002xxx", d:"观察", h:"仅观察", p:42, r5:"-1.2%", r10:"+6.8%", r20:"+12.4%", d20:"+2.8%", atr:"4.5%", vr:"0.85", st:"回调观察", ns:"正面"},
        {n:"某高位股", c:"600xxx", d:"不买", h:"高位风险", p:30, r5:"+18.5%", r10:"+28.2%", r20:"+35.7%", d20:"+17.3%", atr:"5.2%", vr:"2.10", st:"高位观察", ns:"负面"}
      ]
    };

    function badge(c,s){return `<span class="badge ${c}">${s}</span>`;}
    function sign(v){return v.startsWith('+')?'green':(v.startsWith('-')?'red':'gray');}

    document.getElementById('envValue').textContent = data.marketEnv;
    document.getElementById('envDesc').textContent = data.marketEnv === "强" ? "建议仓位 70%~100%" : "建议仓位 30%~60%";
    document.getElementById('envIcon').textContent = data.marketEnv === "强" ? "🟢" : "🟡";

    document.getElementById('newsList').innerHTML = data.news.map(n=>
      `<div style="padding:6px 0;border-bottom:1px solid #333;">
        <div>${n.t}</div>
        <div class="muted">${badge(n.c,n.s)} 相关：${n.r}</div>
      </div>`).join('');

    document.getElementById('sectorList').innerHTML = data.sectors.map(s=>
      `<div style="min-width:120px;background:#0f0f1a;padding:10px;border-radius:8px;">
        <div><b>${s.n}</b></div>
        <div class="muted">评分 ${s.score}/5</div>
        <div>${badge(s.state==="持续强势"?"green":"yellow",s.state)}</div>
      </div>`).join('');

    document.getElementById('stockList').innerHTML = data.stocks.map(s=>
      `<div style="border-bottom:1px solid #333;padding:10px 0;">
        <div class="row">
          <b>${s.n}</b> <span class="muted">${s.c}</span>
          ${badge(s.d==="买"?"green":s.d==="观察"?"yellow":"red",s.d)}
        </div>
        <div class="grid2">
          <div class="item">5日<span class="${sign(s.r5)}">${s.r5}</span></div>
          <div class="item">10日<span class="${sign(s.r10)}">${s.r10}</span></div>
          <div class="item">20日<span class="${sign(s.r20)}">${s.r20}</span></div>
          <div class="item">距MA20<span class="${sign(s.d20)}">${s.d20}</span></div>
        </div>
        <div class="muted">⏱ ${s.h} | 状态：${s.st} | 新闻：${s.ns}</div>
        <div class="row" style="margin-top:5px;">
          <span class="muted">10日上涨概率</span>
          <div style="flex:1;height:4px;background:#333;margin:0 8px;border-radius:2px;"><div style="width:${s.p}%;height:4px;background:#00c853;border-radius:2px;"></div></div>
          <b>${s.p}%</b>
        </div>
      </div>`).join('');

    document.getElementById('updateTime').textContent = new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  </script>
</body>
</html>
